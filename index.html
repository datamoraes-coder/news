<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notícias">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23bb1919'/%3E%3Ctext x='90' y='115' font-size='80' font-family='Arial' font-weight='900' fill='white' text-anchor='middle'%3ENEWS%3C/text%3E%3C/svg%3E">
<title>Notícias</title>
<style>
:root{--bg:#fff;--fg:#141414;--mut:#6b6b6b;--line:#e6e6e6;--red:#bb1919;--bar:#000;--card:#f6f6f6}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#f2f2f2;--mut:#9a9a9a;--line:#2c2c2c;--card:#1c1c1c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bar);padding:env(safe-area-inset-top,0) 12px 0}
.top{display:flex;align-items:center;justify-content:space-between;height:52px}
.logo{display:flex;gap:3px;background:none;border:0;padding:0;cursor:pointer}
.logo b{background:#fff;color:#000;font-weight:900;font-size:17px;padding:1px 6px;line-height:22px}
.flags{display:flex;gap:8px}
.flags button{background:#222;border:2px solid transparent;border-radius:8px;padding:5px 7px;display:flex;opacity:.55}
.flags svg{width:30px;height:21px;border-radius:3px;display:block}
.flags button.on{border-color:#fff;background:#333;opacity:1}
nav{display:flex;overflow-x:auto;scrollbar-width:none;background:var(--bg);border-bottom:1px solid var(--line);margin:0 -12px;padding:0 12px}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;background:none;border:0;border-bottom:4px solid transparent;color:var(--fg);font-size:15px;font-weight:700;padding:13px 14px 9px}
nav button.on{border-bottom-color:var(--red)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-height:0;opacity:0;padding:0 16px;transform:translateY(-6px);transition:max-height .3s ease,opacity .25s ease,padding .3s ease,transform .3s ease;pointer-events:none}
.chips.open{max-height:64px;opacity:1;padding:12px 16px 4px;transform:none;pointer-events:auto}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600}
.chips button.on{background:var(--fg);color:var(--bg)}
main{max-width:680px;margin:0 auto;padding-bottom:calc(30px + env(safe-area-inset-bottom,0))}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0;color:var(--mut);font-size:12px}
.bar button{background:none;border:0;color:var(--red);font-weight:700;font-size:13px}
.hero{display:block;text-decoration:none;color:inherit;padding:12px 0 0}
.hero .img{height:220px;background:linear-gradient(135deg,var(--red),#1a1a1a);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:14px}
.hero .img img,.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .img:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.65))}
.hero .img span{position:relative;z-index:1}
.hero .img span{color:#fff;font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;opacity:.9}
.hero h2{font-size:25px;line-height:1.15;margin:12px 16px 6px;font-weight:800}
.hero p{margin:0 16px;color:var(--mut);font-size:15px;line-height:1.35}
.meta{display:flex;gap:8px;align-items:center;margin:8px 16px 0;font-size:12px;color:var(--mut)}
.tag{color:var(--red);font-weight:800;text-transform:uppercase}
.item{display:flex;gap:12px;align-items:flex-start;text-decoration:none;color:inherit;margin:0 16px;padding:14px 0;border-top:1px solid var(--line)}
.item .tx{flex:1;min-width:0}
.th{flex:none;width:112px;height:76px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--red),#1a1a1a);border-radius:2px}
#feed>*{animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.item h3{font-size:17px;line-height:1.25;margin:0;font-weight:700}
.item .meta{margin:6px 0 0}
.state{padding:40px 24px;text-align:center;color:var(--mut);line-height:1.5}
.sk{height:16px;animation:p 1.2s infinite;margin:16px;background:var(--card);border-radius:4px;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.4}}
</style>
</head>
<body>
<header>
  <div class="top">
    <button class="logo" id="logo" aria-label="Início"><b>N</b><b>E</b><b>W</b><b>S</b></button>
    <div class="flags">
      <button id="fBR" aria-label="Brasil"><svg viewBox="0 0 30 21"><rect width="30" height="21" fill="#009c3b"/><path d="M15 2.5 27 10.5 15 18.5 3 10.5Z" fill="#ffdf00"/><circle cx="15" cy="10.5" r="4.6" fill="#002776"/><path d="M10.6 9.6q4.6-1.3 8.8 1.3" stroke="#fff" stroke-width=".9" fill="none"/></svg></button>
      <button id="fUS" aria-label="United States"><svg viewBox="0 0 30 21"><rect width="30" height="21" fill="#fff"/><g fill="#b22234"><rect width="30" height="1.6"/><rect y="3.2" width="30" height="1.6"/><rect y="6.5" width="30" height="1.6"/><rect y="9.7" width="30" height="1.6"/><rect y="12.9" width="30" height="1.6"/><rect y="16.1" width="30" height="1.6"/><rect y="19.4" width="30" height="1.6"/></g><rect width="13" height="11.3" fill="#3c3b6e"/><g fill="#fff"><circle cx="2.5" cy="2.2" r=".7"/><circle cx="5.5" cy="2.2" r=".7"/><circle cx="8.5" cy="2.2" r=".7"/><circle cx="11" cy="2.2" r=".7"/><circle cx="4" cy="4.8" r=".7"/><circle cx="7" cy="4.8" r=".7"/><circle cx="10" cy="4.8" r=".7"/><circle cx="2.5" cy="7.4" r=".7"/><circle cx="5.5" cy="7.4" r=".7"/><circle cx="8.5" cy="7.4" r=".7"/><circle cx="11" cy="7.4" r=".7"/><circle cx="4" cy="9.8" r=".7"/><circle cx="7" cy="9.8" r=".7"/><circle cx="10" cy="9.8" r=".7"/></g></svg></button>
    </div>
  </div>
  <nav id="tabs"></nav>
</header>
<div class="chips" id="chips"></div>
<main>
  <div class="bar"><span id="upd"></span><button id="ref"></button></div>
  <div id="feed"></div>
</main>

<script>
const CFG={
 BR:{mkt:"pt-BR",topq:"principais notícias do Brasil hoje",hl:"hl=pt-BR&gl=BR&ceid=BR:pt-419",ui:{refresh:"↻ Atualizar",upd:"Atualizado às ",loading:"Carregando…",err:"Não foi possível carregar as notícias agora. Verifique sua conexão e toque em Atualizar.",ago:["agora","min","h","d"],top:"Destaque"},
  tabs:{top:"Principais",politics:"Política",sports:"Esportes",police:"Polícia"},
  q:{top:"",politics:"política Brasil",sports:"esportes futebol",police:"polícia"},
  sub:{"politics": [["Geral", ""], ["Senado", "Senado Federal"], ["Câmara", "Câmara dos Deputados"], ["Planalto", "Lula governo Planalto"], ["STF", "STF Supremo Tribunal Federal"], ["Eleições", "eleições 2026"], ["Partidos", "partidos políticos Brasil"], ["Economia", "economia governo federal"], ["Exterior", "Itamaraty relações exteriores"]], "sports": [["Geral", ""], ["Futebol", "futebol"], ["Brasileirão", "Brasileirão Série A"], ["Seleção", "Seleção Brasileira"], ["Libertadores", "Libertadores"], ["Copa do Brasil", "Copa do Brasil"], ["Vôlei", "vôlei"], ["Basquete", "basquete NBA"], ["Fórmula 1", "Fórmula 1"], ["Tênis", "tênis"], ["UFC / MMA", "UFC MMA"]], "police": [["Geral", ""], ["Polícia Federal", "\"Polícia Federal\""], ["Polícia Civil", "\"Polícia Civil\""], ["Polícia Militar", "\"Polícia Militar\""], ["PRF", "\"Polícia Rodoviária Federal\""], ["Guarda Municipal", "\"Guarda Municipal\""], ["Bombeiros", "\"Corpo de Bombeiros\""]]}},
 US:{mkt:"en-US",topq:"top news today United States",hl:"hl=en-US&gl=US&ceid=US:en",ui:{refresh:"↻ Refresh",upd:"Updated ",loading:"Loading…",err:"Couldn't load the news right now. Check your connection and tap Refresh.",ago:["now","m","h","d"],top:"Top story"},
  tabs:{top:"Top Stories",politics:"Politics",sports:"Sports",police:"Police"},
  q:{top:"",politics:"US politics",sports:"sports",police:"police"},
  sub:{"politics": [["General", ""], ["Senate", "US Senate"], ["House", "US House of Representatives"], ["White House", "White House"], ["Supreme Court", "Supreme Court"], ["Elections", "US elections"], ["Democrats", "Democratic Party"], ["Republicans", "Republican Party"], ["Foreign Policy", "US foreign policy"]], "sports": [["General", ""], ["NFL", "NFL"], ["NBA", "NBA"], ["MLB", "MLB"], ["NHL", "NHL"], ["Soccer", "MLS soccer"], ["College Football", "college football"], ["UFC / MMA", "UFC MMA"], ["Golf", "golf PGA"], ["Tennis", "tennis"], ["Formula 1", "Formula 1"]], "police": [["General", ""], ["FBI", "FBI"], ["NYPD", "NYPD"], ["LAPD", "LAPD"], ["DEA", "DEA"], ["Sheriff", "sheriff's office"], ["State Police", "\"state police\""], ["Highway Patrol", "\"highway patrol\""]]}}
};
let S=JSON.parse(localStorage.getItem("st2")||'{"c":"BR","t":"top","d":0}');
const $=id=>document.getElementById(id);
const save=()=>localStorage.setItem("st2",JSON.stringify(S));
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip=h=>{const d=document.createElement("div");d.innerHTML=h||"";return d.textContent.trim()};

function ago(date,u){let t=Date.parse(date);if(isNaN(t))t=Date.parse(String(date).replace(" ","T")+"Z");
 const m=(Date.now()-t)/6e4;if(isNaN(m))return"";if(m<2)return u[0];if(m<60)return Math.round(m)+u[1];if(m<1440)return Math.round(m/60)+u[2];return Math.round(m/1440)+u[3]}

function shell(){
 const c=CFG[S.c];
 $("fBR").classList.toggle("on",S.c==="BR");$("fUS").classList.toggle("on",S.c==="US");
 document.documentElement.lang=S.c==="BR"?"pt-BR":"en";
 $("tabs").innerHTML=Object.keys(c.tabs).map(k=>`<button data-t="${k}" class="${S.t===k?"on":""}">${c.tabs[k]}</button>`).join("");
 const ch=$("chips");
 if(S.t==="top")ch.classList.remove("open");
 else{ch.innerHTML=c.sub[S.t].map((d,i)=>`<button data-d="${i}" class="${S.d===i?"on":""}">${d[0]}</button>`).join("");ch.classList.add("open");const on=ch.querySelector(".on");if(on)ch.scrollLeft=Math.max(0,on.offsetLeft-16)}
 $("ref").textContent=c.ui.refresh;
}

const PROX=[u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),u=>"https://corsproxy.io/?"+encodeURIComponent(u)];
async function getText(u){
 for(const p of PROX){try{const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),9000);
  const r=await fetch(p(u),{signal:ctl.signal,cache:"no-store"});clearTimeout(t);
  if(!r.ok)continue;const x=await r.text();if(x.includes("<item"))return x}catch(e){}}
 return null}
function parseBing(xml){
 const d=new DOMParser().parseFromString(xml,"text/xml");
 return[...d.getElementsByTagName("item")].map(it=>{
  const g=n=>{const e=it.getElementsByTagName(n)[0];return e?e.textContent.trim():""};
  let l=g("link");try{const u=new URL(l).searchParams.get("url");if(u)l=u}catch(e){}
  return{t:strip(g("title")),s:g("News:Source"),l,d:g("pubDate"),img:g("News:Image").replace(/^http:/,"https:"),x:strip(g("description"))}
 }).filter(i=>i.t&&i.l)}
async function googleFallback(q,c){
 const rss=q?"https://news.google.com/rss/search?q="+encodeURIComponent(q+" when:2d")+"&"+c.hl:"https://news.google.com/rss?"+c.hl;
 const r=await fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(rss),{cache:"no-store"});
 const j=await r.json();if(j.status!=="ok"||!j.items.length)throw 0;
 return j.items.map(i=>{const p=i.title.lastIndexOf(" - ");return{t:p>0?i.title.slice(0,p):i.title,s:p>0?i.title.slice(p+3):"",l:i.link,d:i.pubDate,img:"",x:""}})}

let seq=0;
async function load(){
 shell();
 const c=CFG[S.c],me=++seq;
 const q=S.t==="top"?c.topq:(c.sub[S.t][S.d][1]||c.q[S.t]);
 const key="c2:"+S.c+":"+q;
 const cached=JSON.parse(localStorage.getItem(key)||"null");
 if(cached)render(cached.items,cached.at);
 else $("feed").innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>';
 try{
  let items=null;
  const bing="https://www.bing.com/news/search?q="+encodeURIComponent(q)+"&format=rss&setmkt="+c.mkt+"&qft="+encodeURIComponent('sortbydate="1"');
  const xml=await getText(bing);
  if(xml)items=parseBing(xml);
  if(!items||!items.length)items=await googleFallback(S.t==="top"?"":q,c);
  const seen=new Set();items=items.filter(i=>!seen.has(i.t)&&seen.add(i.t)).slice(0,25);
  if(me!==seq)return;
  try{localStorage.setItem(key,JSON.stringify({items,at:Date.now()}))}catch(e){}
  render(items,Date.now());
 }catch(e){
  if(me!==seq||cached)return;
  $("feed").innerHTML=`<div class="state">${c.ui.err}</div>`;
 }
}

const IMGERR="this.remove()";
function render(items,at){
 const c=CFG[S.c],u=c.ui,tag=S.t!=="top"&&S.d?c.sub[S.t][S.d][0]:c.tabs[S.t];
 const h=items[0];
 $("upd").textContent=u.upd+new Date(at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
 const snip=h.x&&h.x!==h.t?`<p>${esc(h.x.slice(0,150))}${h.x.length>150?"…":""}</p>`:"";
 let html=`<a class="hero" href="${esc(h.l)}" target="_blank" rel="noopener">
  <div class="img">${h.img?`<img src="${esc(h.img)}" alt="" referrerpolicy="no-referrer" onerror="${IMGERR}">`:""}<span>${u.top}${h.s?" · "+esc(h.s):""}</span></div>
  <h2>${esc(h.t)}</h2>${snip}
  <div class="meta"><span class="tag">${esc(tag)}</span><span>${ago(h.d,u.ago)}</span></div></a>`;
 html+=items.slice(1).map(i=>`<a class="item" href="${esc(i.l)}" target="_blank" rel="noopener">
  <div class="tx"><h3>${esc(i.t)}</h3>
  <div class="meta"><span class="tag">${esc(tag)}</span><span>${esc(i.s)}</span><span>· ${ago(i.d,u.ago)}</span></div></div>
  ${i.img?`<div class="th"><img src="${esc(i.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="${IMGERR}"></div>`:""}</a>`).join("");
 $("feed").innerHTML=html;
}

$("fBR").onclick=()=>{S={c:"BR",t:S.t,d:0};save();load()};
$("fUS").onclick=()=>{S={c:"US",t:S.t,d:0};save();load()};
$("tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.t=b.dataset.t;S.d=0;save();window.scrollTo(0,0);load()};
$("chips").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.d=+b.dataset.d;save();load()};
$("ref").onclick=load;
$("logo").onclick=()=>{S.t="top";S.d=0;save();window.scrollTo(0,0);$("tabs").scrollTo(0,0);load()};
setInterval(()=>{if(!document.hidden)load()},300000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
load();
</script>
</body>
</html>
